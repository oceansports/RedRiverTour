function IMG(n) { return (window.IMGS && window.IMGS[n]) || "images/" + n; }
var IDX = {vi:0,en:1}, LANG = "vi", CAT = "all";

try { var s = localStorage.getItem("lang"); if (T[s]) LANG = s; } catch (e) {}

function track(ch, where) {
  if (!TRACK_URL || TRACK_URL.indexOf("http") !== 0) return;
  var ref = "";
  try { ref = document.referrer ? new URL(document.referrer).hostname : ""; } catch (e) {}
  try {
    fetch(TRACK_URL, {method:"POST", mode:"no-cors", keepalive:true, headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({channel:ch, where:where, loc:"pq", lang:LANG, ref:ref})}).catch(function(){});
  } catch (e) {}
}
document.addEventListener("click", function (e) {
  var a = e.target.closest("[data-ch]");
  if (a) track(a.getAttribute("data-ch"), a.getAttribute("data-where") || "");
  var o = e.target.closest("[data-open]");
  if (o) openLb(IMG(o.getAttribute("data-open")));
});

function money(p) { return LANG === "vi" ? p + "₫" : p.replace(/\./g, ",") + "₫"; }

function render() {
  var i = IDX[LANG], L = T[LANG];
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = L[el.getAttribute("data-t")]; });
  document.querySelectorAll("#lang button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-l") === LANG); });
  document.getElementById("chips").innerHTML = Object.keys(CATS).map(function (k) {
    return '<button data-c="' + k + '"' + (k === CAT ? ' class="on"' : "") + ">" + CATS[k][i] + "</button>";
  }).join("");
  document.getElementById("grid").innerHTML = TOURS.filter(function (t) { return CAT === "all" || t.c === CAT; }).map(function (t) {
    return '<article class="card"><div class="ph"><button class="pbtn" data-open="tour-' + t.id + '.png" aria-label="' + t.t[i] + '"><img loading="lazy" decoding="async" src="' + IMG("card-" + t.id + ".png") + '" alt="' + t.t[i] + '"></button>' +
      '<span class="code">' + t.k + '</span><div class="pb">' + (t.m ? L.from + " " : "") + "<b>" + money(t.p) + "</b>" + L.pax + "</div></div>" +
      '<div class="cb"><h3>' + t.t[i] + "</h3><p>" + t.d[i] + "</p>" +
      '<div class="time">⏰ ' + L.time + ": " + t.h + "</div>" +
      '<button class="btn" data-open="tour-' + t.id + '.png">' + L.view + "</button></div></article>";
  }).join("");
  document.getElementById("adSt").innerHTML = L.adStores.map(function (r) { return "<b>" + r[0] + "</b>" + r[1] + "<br>" + r[2]; }).join("");
  document.getElementById("pick").innerHTML = L.pickRows.map(function (r) { return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>"; }).join("");
  document.getElementById("pol").innerHTML = L.pol.map(function (r) { return "<div><h4>" + r[0] + "</h4><p>" + r[1] + "</p></div>"; }).join("");
  document.title = "Red River Tour – " + L.toursH;
}
document.getElementById("lang").addEventListener("click", function (e) {
  var l = e.target.getAttribute("data-l");
  if (!l) return;
  LANG = l;
  try { localStorage.setItem("lang", l); } catch (x) {}
  render();
});
document.getElementById("chips").addEventListener("click", function (e) {
  var c = e.target.getAttribute("data-c");
  if (c) { CAT = c; render(); }
});

var lb = document.getElementById("lb"), lbi = document.getElementById("lbi");
function openLb(src) { lbi.src = src; lbi.classList.remove("z"); lb.classList.add("on"); lb.scrollTop = 0; lb.scrollLeft = 0; document.body.style.overflow = "hidden"; try { history.pushState({lb:1}, ""); } catch (e) {} }
function closeLb(fromPop) {
  if (!lb.classList.contains("on")) return;
  lb.classList.remove("on"); document.body.style.overflow = "";
  if (fromPop !== true) { try { if (history.state && history.state.lb) history.back(); } catch (e) {} }
}
window.addEventListener("popstate", function () { closeLb(true); });
lbi.addEventListener("click", function () { lbi.classList.toggle("z"); });
document.getElementById("lbx").addEventListener("click", closeLb);
lb.addEventListener("click", function (e) { if (e.target === lb) closeLb(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeLb(); });
document.getElementById("mapImg").addEventListener("click", function () { openLb(IMG("map.png")); });

function hh() { document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + "px"); }
hh(); window.addEventListener("resize", hh); window.addEventListener("load", hh);
render();
</script>
